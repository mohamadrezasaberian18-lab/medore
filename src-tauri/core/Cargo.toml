[package]
name = "medore-core"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "MEDORE media player: file names, subtitles, languages, ordering and settings rules"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fancy-regex = "0.14"
encoding_rs = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
