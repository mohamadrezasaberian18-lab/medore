<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1B1B"/>
      <stop offset="1" stop-color="#090909"/>
    </linearGradient>
    <linearGradient id="front" gradientUnits="userSpaceOnUse" x1="160" y1="230" x2="660" y2="520">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F1F1F3"/>
      <stop offset="1" stop-color="#C9C9CE"/>
    </linearGradient>
    <linearGradient id="back" gradientUnits="userSpaceOnUse" x1="520" y1="500" x2="830" y2="240">
      <stop offset="0" stop-color="#5E5E64"/>
      <stop offset="0.42" stop-color="#B9B9BF"/>
      <stop offset="1" stop-color="#F6F6F8"/>
    </linearGradient>
    <linearGradient id="rleg" gradientUnits="userSpaceOnUse" x1="0" y1="360" x2="0" y2="770">
      <stop offset="0" stop-color="#E6E6E9" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#E6E6E9" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#E6E6E9"/>
      <stop offset="1" stop-color="#9C9CA2"/>
    </linearGradient>
    <linearGradient id="lleg" gradientUnits="userSpaceOnUse" x1="250" y1="395" x2="170" y2="770">
      <stop offset="0" stop-color="#606066"/>
      <stop offset="0.3" stop-color="#C6C6CB"/>
      <stop offset="1" stop-color="#F4F4F6"/>
    </linearGradient>
    <linearGradient id="tri" gradientUnits="userSpaceOnUse" x1="450" y1="580" x2="580" y2="730">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D6D6DA"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="1000" rx="224" fill="url(#bg)"/>
  <rect x="2" y="2" width="996" height="996" rx="222" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="4"/>
  <g transform="translate(50 46) scale(0.9)">
    <!-- rising band, top-right arch and right leg (behind) -->
    <path d="M505 372 C620 300 700 228 760 228 C815 228 845 262 845 321 L845 695 A75 75 0 0 1 695 695 L695 427 L505 527 Z"
          fill="url(#back)" stroke="url(#back)" stroke-width="14" stroke-linejoin="round"/>
    <path d="M695 360 L845 360 L845 695 A75 75 0 0 1 695 695 Z" fill="url(#rleg)" stroke="url(#rleg)" stroke-width="14" stroke-linejoin="round"/>
    <!-- top-left arch descending into the valley (front), folding over the rising band -->
    <path d="M150 480 L150 321 C150 262 180 228 236 228 C275 228 300 236 330 252 L669 441 L505 527 L305 418 L305 480 Z"
          fill="url(#front)" stroke="url(#front)" stroke-width="14" stroke-linejoin="round"/>
    <!-- left leg, tucked in front of the arch -->
    <rect x="143" y="395" width="169" height="382" rx="84.5" fill="url(#lleg)"/>
    <!-- play -->
    <path d="M452 590 L452 726 L582 658 Z" fill="url(#tri)" stroke="url(#tri)" stroke-width="34" stroke-linejoin="round"/>
  </g>
</svg>
